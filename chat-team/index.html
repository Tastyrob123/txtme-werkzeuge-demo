<script>/* Frame R03/R04: note errors before anything else runs (to localStorage and to api/fehler), and the start-failure door with «Open check». Network errors never, at most 20 per page, its own failure never again. */
(function(){var zahl=0;function merk(t){t=String(t);if(++zahl>20||/Load failed|access control|abort|NetworkError|Failed to fetch/i.test(t))return;
try{var a=JSON.parse(localStorage.getItem('chat-team-fehler')||'[]');a.push({zeit:new Date().toISOString(),text:t.slice(0,600)});localStorage.setItem('chat-team-fehler',JSON.stringify(a.slice(-30)))}catch(e){}
try{fetch('api/fehler',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:'Chat Team · '+t.slice(0,580)}),keepalive:true}).catch(function(){})}catch(e){}}
window.addEventListener('error',function(e){if(!e.message&&e.target&&e.target!==window)return;merk((e.message||'Error')+' · '+(e.filename||'').split('/').pop()+':'+(e.lineno||''))});
window.addEventListener('unhandledrejection',function(e){merk('Promise: '+((e.reason&&e.reason.message)||e.reason))});window.werkzeugMerk=merk;
window.werkzeugTuer=function(grund){if(document.getElementById('wz-tuer'))return;var d=document.createElement('div');d.id='wz-tuer';d.setAttribute('role','alert');
d.style.cssText='position:fixed;inset:0;z-index:2147483000;visibility:visible;display:grid;place-items:center;padding:24px;background:rgba(11,11,12,.94);color:#f4f2ee;font-family:"Space Grotesk",system-ui,sans-serif;text-align:center';
d.innerHTML='<div style="max-width:520px"><p style="font-size:1.5rem;font-weight:600;margin:0 0 10px">Chat Team does not start.</p><p id="wz-tuer-t" style="margin:0 0 22px;color:rgba(244,242,238,.75)"></p>'+
'<a href="pruefung.html" style="display:inline-block;margin:0 6px;padding:12px 20px;border-radius:999px;background:linear-gradient(100deg,#60c4e3,#eb5986);color:#0b0b0c;text-decoration:none;font-weight:600">Open check</a>'+
'<button type="button" onclick="location.reload()" style="margin:0 6px;padding:12px 20px;border-radius:999px;border:1px solid rgba(244,242,238,.4);background:none;color:#f4f2ee;font:inherit;cursor:pointer">Reload</button></div>';
d.querySelector('#wz-tuer-t').textContent=String(grund||'The tool did not load.').replace(/^[A-ZÄÖÜ-]+ · /,'');(document.body||document.documentElement).appendChild(d);merk('Start failure: '+grund)};
setTimeout(function c(){if(window.__chatDemoLaedt)return void setTimeout(c,2000);if(!document.getElementById('kopf')||document.getElementById('kopf').children.length)return;if(document.documentElement.classList.contains('auftakt')||document.getElementById('tuer')&&!document.getElementById('tuer').hidden)return;werkzeugTuer('The page did not build its view in 12 seconds.')},12000);
})();</script>
